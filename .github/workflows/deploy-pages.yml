# Автодеплой на GitHub Pages при кожному push у main.
# Сайт — чиста статика, збірка не потрібна: віддаємо корінь репозиторію як є.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # можна запустити вручну з вкладки Actions

# Права, потрібні для публікації на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно виконується лише один деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Налаштувати Pages
        uses: actions/configure-pages@v5

      - name: Завантажити файли сайту
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # корінь репозиторію

      - name: Опублікувати
        id: deployment
        uses: actions/deploy-pages@v4
