# Конфіг для Netlify / Cloudflare Pages.
# Сайт — чиста статика, тому збірка не потрібна: публікуємо корінь репозиторію.

[build]
  publish = "."
  command = ""

# Кешування статики. HTML не кешуємо, щоб правки одразу бачив користувач.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Базові заголовки безпеки
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
